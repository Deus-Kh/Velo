# Prometheus scrape config for the Velo server (T4.6).
# The server exposes /metrics only when METRICS_TOKEN is set; scrape with the same token.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: velo-server
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/velo-metrics-token   # the METRICS_TOKEN value, mode 0600
    static_configs:
      - targets: ['api.velo.example:443']
